name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core engine (pure JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Provider + coercion tests
        run: ./gradlew :core:providerTests

      - name: Smart-search intent tests
        run: ./gradlew :core:intentTests

      - name: On-device AI layer tests
        run: ./gradlew :core:aiTests

      - name: Dataset / transform / dedup / export tests
        run: ./gradlew :core:datasetTests

      - name: Export + persistence contract tests
        run: ./gradlew :core:contractTests

      - name: Provider pagination tests
        run: ./gradlew :core:paginationTests

      - name: Repository contract (InMemory)
        run: ./gradlew :core:storeContractTests

      - name: Cross-engine conformance
        run: ./gradlew :core:conformance

      - name: Confirm conformance output exists
        run: |
          if [ ! -f kotlin-results.json ]; then
            echo "::error::kotlin-results.json missing — the parity job cannot run."
            exit 1
          fi
          echo "kotlin-results.json ($(stat -c%s kotlin-results.json) bytes)"

      - uses: actions/upload-artifact@v4
        with:
          name: kotlin-results
          path: kotlin-results.json
          if-no-files-found: error

  parity:
    name: Parity with Python engine
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
        with: { path: android }
      - name: Check out the Python engine
        uses: actions/checkout@v4
        with:
          repository: soobujmiah/datakhoj
          token: ${{ secrets.DATAKHOJ_PAT }}
          path: python
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: kotlin-results }

      - name: Run the Python engine on the same corpus
        working-directory: python
        run: |
          pip install -e .
          python - <<'PY'
          import json, pathlib
          from datakhoj.core.jobspec import JobSpec
          from datakhoj.core.errors import NoResultsError
          cases = pathlib.Path("spec/conformance/cases"); out = {}
          for job in sorted(cases.glob("*.job.json")):
              case = job.name[:-len(".job.json")]
              spec = JobSpec.load(job)
              html = (cases / f"{case}.html").read_text(encoding="utf-8")
              try:
                  out[case] = spec.run_offline(html)
              except NoResultsError as e:
                  out[case] = {"__error__": "NoResultsError", "__exit_code__": e.exit_code}
          pathlib.Path("../python-results.json").write_text(
              json.dumps(out, indent=2, ensure_ascii=False, sort_keys=True))
          PY

      - name: Engines must agree
        run: |
          python - <<'PY'
          import json, sys
          py = json.load(open("python-results.json"))
          kt = json.load(open("kotlin-results.json"))
          bad = [c for c in sorted(set(py) | set(kt)) if py.get(c) != kt.get(c)]
          for c in bad:
              print(f"::error::ENGINE DIVERGENCE in {c}")
              print(f"  python: {json.dumps(py.get(c), ensure_ascii=False)}")
              print(f"  kotlin: {json.dumps(kt.get(c), ensure_ascii=False)}")
          if bad: sys.exit(1)
          print(f"OK — {len(py)} cases identical on both engines.")
          PY

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: datakhoj-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    name: Room contract on emulator (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # GitHub's ubuntu runners expose /dev/kvm, so an x86_64 emulator runs at
      # near-native speed. This is what lets Room, SQLite and transaction
      # behaviour be verified without physical hardware.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: warn
