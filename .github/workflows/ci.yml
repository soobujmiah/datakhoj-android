name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core engine (pure JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test

      - name: Provider + coercion tests
        run: ./gradlew :core:providerTests

      - name: Smart-search intent tests
        run: ./gradlew :core:intentTests

      - name: On-device AI layer tests
        run: ./gradlew :core:aiTests

      - name: Dataset / transform / dedup / export tests
        run: ./gradlew :core:datasetTests

      - name: Export + persistence contract tests
        run: ./gradlew :core:contractTests

      - name: Provider pagination tests
        run: ./gradlew :core:paginationTests

      - name: Repository contract (InMemory)
        run: ./gradlew :core:storeContractTests

      - name: Conformance corpus
        run: ./gradlew :core:conformance

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: datakhoj-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  emulator:
    name: Room contract on emulator (API 34)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4

      # GitHub's ubuntu runners expose /dev/kvm, so an x86_64 emulator runs at
      # near-native speed. This is what lets Room, SQLite and transaction
      # behaviour be verified without physical hardware.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: app/build/reports/androidTests/
          if-no-files-found: warn
