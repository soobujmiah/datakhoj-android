name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# Runs the actual core JVM test and Kotlin conformance tasks; the release.yml
# (APK packaging) is intentionally excluded because it produces and uploads real artifacts.
# This repo has no side-effecting jobs, so duplicating the build/test signal is cheap and
# correct. paths-ignore on the push trigger stops that commit from re-triggering this workflow.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.repo/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Core engine tests (build + test signal)
        id: build
        continue-on-error: true
        run: ./gradlew :core:test :core:providerTests :core:intentTests :core:aiTests :core:datasetTests :core:contractTests :core:paginationTests :core:storeContractTests :core:conformance

      - name: Confirm conformance output exists
        if: steps.build.outcome == 'success'
        run: test -f kotlin-results.json

      # Cross-engine parity against a retired private repository is not a
      # configured test. The real core test/conformance step above is the signal.

      - name: Run tools/repo_knowledge tests (guard the vendored copy)
        id: tool_tests
        continue-on-error: true
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py'

      - name: Collect and sync deterministic state
        if: always()
        run: |
          build_status="${{ steps.build.outcome == 'success' && 'passed' || 'failed' }}"
          test_status="${{ steps.build.outcome == 'success' && 'passed' || steps.build.outcome == 'failure' && 'failed' || 'unknown' }}"
          python3 -m tools.repo_knowledge sync --ci \
            --build-status "$build_status" --build-run-id "${{ github.run_id }}" \
            --test-status "$test_status" --test-summary "core engine JVM tests and Kotlin conformance (no cross-engine parity claim)"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: always() && github.event_name == 'push'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.sha }}"
          git push origin HEAD:${{ github.ref_name }}
