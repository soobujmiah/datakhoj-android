name: Build Signed APK

# Builds on GitHub's runners (16 GB RAM). Android builds need 4-8 GB for
# AGP + Kotlin + the Compose compiler + R8, which is more than a small dev
# box can spare.
#
# The signing key never enters the repo — it is restored at build time from
# the KEYSTORE_BASE64 secret and deleted immediately afterwards.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Which variant to build"
        type: choice
        options: [release, debug, both]
        default: release

permissions:
  contents: write

jobs:
  build:
    name: Assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ---- engine must be green before we ship anything ----
      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Cross-engine conformance
        run: ./gradlew :core:conformance

      - name: Provider + coercion tests
        run: ./gradlew :core:providerTests

      - name: Smart-search intent tests
        run: ./gradlew :core:intentTests

      - name: On-device AI layer tests
        run: ./gradlew :core:aiTests

      # ---- signing material, restored just in time ----
      - name: Restore keystore
        if: ${{ github.event.inputs.build_type != 'debug' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — cannot sign."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/datakhoj-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/datakhoj-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "Keystore restored ($(stat -c%s keystore/datakhoj-release.jks) bytes)"

      - name: Build release APK
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' }}
        run: ./gradlew :app:assembleDebug --stacktrace

      # ---- prove the artifact is really signed ----
      - name: Verify signature
        if: ${{ github.event.inputs.build_type != 'debug' }}
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK: $APK"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose --print-certs "$APK"
          echo
          echo "### APK" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "file : $(basename $APK)" >> $GITHUB_STEP_SUMMARY
          echo "size : $(du -h "$APK" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs "$APK" \
            | grep -E "SHA-256|Signer #1 certificate DN" >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Rename artifacts
        run: |
          mkdir -p dist
          for f in $(find app/build/outputs/apk -name "*.apk"); do
            v=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
            t=$(echo "$f" | grep -q release && echo release || echo debug)
            cp "$f" "dist/datakhoj-${v}-${t}.apk"
          done
          ls -lh dist/

      - name: Scrub signing material
        if: always()
        run: rm -f keystore/datakhoj-release.jks keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: datakhoj-apk
          path: dist/*.apk
          retention-days: 90

      # ---- tagged pushes become downloadable releases ----
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## DataKhoj ${{ github.ref_name }}

            Signed APK for **Redmi Turbo 4 Pro** (Snapdragon 8s Gen 4, Android 15).
            `arm64-v8a` · minSdk 26 · targetSdk 35

            Install: download the APK, allow "Install unknown apps" for your
            browser or file manager, then tap it.

            Sideloaded build — not from Google Play, so Play Protect may warn
            on first install. The signing certificate is shown in the build log.
