name: Build APKs (no publish)

# Builds BOTH debug and release APKs and uploads them as workflow artifacts.
#
# This workflow deliberately does NOT publish. There is no release step, no
# tag creation and no upload to any store — per the project's release policy,
# distribution is a separate, explicit phase. Removing the publish step
# entirely (rather than disabling it) means it cannot fire by accident.
#
# Runs on GitHub's runners: Android needs 4-8 GB for AGP + Kotlin + the
# Compose compiler + R8, more than a small dev box can spare.
#
# The signing key never enters the repo — it is restored at build time from
# the KEYSTORE_BASE64 secret and scrubbed in an always() step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug + release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # ---- engine must be green before we ship anything ----
      - name: Core unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Cross-engine conformance
        run: ./gradlew :core:conformance

      - name: Provider + coercion tests
        run: ./gradlew :core:providerTests

      - name: Smart-search intent tests
        run: ./gradlew :core:intentTests

      - name: On-device AI layer tests
        run: ./gradlew :core:aiTests

      - name: Dataset / transform / dedup / export tests
        run: ./gradlew :core:datasetTests

      - name: Export + persistence contract tests
        run: ./gradlew :core:contractTests

      - name: Provider pagination tests
        run: ./gradlew :core:paginationTests

      # ---- signing material, restored just in time ----
      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing — cannot sign."
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/datakhoj-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/datakhoj-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "Keystore restored ($(stat -c%s keystore/datakhoj-release.jks) bytes)"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Build release APK (signed)
        run: ./gradlew :app:assembleRelease --stacktrace

      # ---- prove the artifact is really signed ----
      - name: Verify signatures
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          SIGNER="$ANDROID_HOME/build-tools/$BT/apksigner"
          echo "## APKs built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for APK in $(find app/build/outputs/apk -name "*.apk" | sort); do
            echo "### $(basename $APK)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "size: $(du -h "$APK" | cut -f1)" >> $GITHUB_STEP_SUMMARY
            "$SIGNER" verify --print-certs "$APK" 2>/dev/null \
              | grep -E "certificate DN|certificate SHA-256" >> $GITHUB_STEP_SUMMARY \
              || echo "debug keystore (Android default)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "--- $APK ---"
            "$SIGNER" verify --verbose --print-certs "$APK" || true
          done

      - name: Collect and name artifacts
        run: |
          mkdir -p dist
          V=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          cp app/build/outputs/apk/debug/*.apk   "dist/datakhoj-${V}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "dist/datakhoj-${V}-release.apk"
          echo "Built:"
          ls -lh dist/

      - name: Scrub signing material
        if: always()
        run: rm -f keystore/datakhoj-release.jks keystore.properties

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: datakhoj-debug-apk
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: datakhoj-release-apk
          path: dist/*-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Note
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts only — nothing published. Download from the" \
               "**Artifacts** section of this run page." >> $GITHUB_STEP_SUMMARY
